name: Docker Build and Push and deploy to AKS
on:
  push:
    branches:
      - main
jobs:
  docker_build_and_push:
    runs-on: ubuntu-latest
    outputs:
      DOCKER_TAG_DATE: ${{ steps.set_env.outputs.DOCKER_TAG_DATE }}
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set current date as environment variable
        id: set_env
        run: |
          echo "DOCKER_TAG_DATE=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV
          echo "::set-output name=DOCKER_TAG_DATE::$(date +'%Y%m%d-%H%M%S')"

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/currencyconverter:${{ env.DOCKER_TAG_DATE }}
  
  deploy_to_kubernetes:
    needs: docker_build_and_push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: authenticate with Azure AKS
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up AKS credentials
        uses: azure/aks-set-context@v1
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Update deployment image
        run: |
          kubectl set image deployment/my-app-deployment my-app-container=${{ secrets.DOCKER_HUB_USERNAME }}/currencyconverter:${{ needs.docker_build_and_push.outputs.DOCKER_TAG_DATE }} --record --namespace=default

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/my-app-deployment
